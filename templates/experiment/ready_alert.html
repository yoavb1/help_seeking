<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Get Ready - Task Commencing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; min-height: 100vh; display: flex; align-items: center; }
        .alert-card { border: none; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 550px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card alert-card p-5 mx-auto text-center">
            <div class="text-warning mb-4">
                <i class="fas fa-exclamation-triangle fa-4x animate-bounce"></i>
            </div>
            <h3 class="font-weight-bold text-dark mb-2">Practice Session Complete</h3>
            <p class="text-secondary small">You have successfully adjusted to the workspace controls. The baseline training sandbox is now closed.</p>

            <div class="alert alert-danger font-weight-bold small my-4 text-uppercase">
                ⚠️ Formal Task Commencing: 50 trials will now be recorded live.
            </div>

            <form method="POST" action="">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-lg btn-block font-weight-bold shadow-sm">
                    Launch Main Task Workspace <i class="fas fa-bolt ml-2"></i>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
