<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demographics Survey</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; min-height: 100vh; display: flex; align-items: center; padding: 40px 0; }
        .survey-card { border: none; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 550px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card survey-card p-5 mx-auto">
            <div class="text-primary mb-3 text-center">
                <i class="fas fa-user-circle fa-3x"></i>
            </div>
            <h3 class="font-weight-bold text-dark text-center mb-2">Demographic Profile</h3>
            <p class="text-secondary text-center small mb-4">Please provide your baseline demographic metrics to complete the analysis parameters.</p>

            <form method="POST" action="">
                {% csrf_token %}
                <div class="form-group">
                    <label class="font-weight-bold text-secondary small text-uppercase">Age</label>
                    <input type="number" name="age" class="form-control form-control-md" placeholder="e.g. 24" min="18" max="100" required>
                </div>
                <div class="form-group mb-4">
                    <label class="font-weight-bold text-secondary small text-uppercase">Gender Identification</label>
                    <select name="gender" class="form-control form-control-md" required>
                        <option value="" selected disabled>Select option...</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="nonbinary">Non-binary</option>
                        <option value="prefer_not_to_say">Prefer not to say</option>
                    </select>
                </div>

                <hr class="my-4">

                <div class="text-center">
                    <button type="submit" class="btn btn-success btn-lg px-5 font-weight-bold shadow-sm">
                        Submit Final Responses <i class="fas fa-paper-plane ml-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
<script>
    // 1. Push a new state so there is a history entry to trap
    history.pushState(null, null, location.href);

    // 2. Intercept any popstate event (triggered when user clicks "Back")
    window.onpopstate = function () {
        history.pushState(null, null, location.href);
        alert("Navigating backwards is disabled during this experiment.");
    };
</script>
</body>
</html>
