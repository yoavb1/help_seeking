<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Update</title>
    <!-- Bootstrap 4 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .notice-card {
            border: none;
            border-radius: 12px;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: #e0f2fe;
            color: #0284c7;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow notice-card text-center p-4 p-md-5">
                    <div class="card-body p-0">

                        <!-- Header Icon -->
                        <div class="mb-4">
                            <div class="icon-circle">
                                <i class="fas fa-clock fa-2x"></i>
                            </div>
                        </div>

                        <!-- Main Heading -->
                        <h2 class="font-weight-bold mb-3 text-dark">Study Update</h2>

                        <!-- Announcement Box -->
                        <div class="alert alert-light border py-3 px-4 mb-4 text-left">
                            <p class="mb-0 text-secondary" style="font-size: 1.05rem;">
                                <i class="fas fa-info-circle text-info mr-2"></i>
                                Due to time constraints, you will <strong>not</strong> be required to complete Task 2.
                            </p>
                        </div>

{#                        <!-- Next Steps Description -->#}
{#                        <p class="text-muted mb-4" style="font-size: 0.95rem;">#}
{#                            Please click the button below to proceed directly to the brief demographic questionnaire and complete your participation.#}
{#                        </p>#}

                        <!-- Action Button (Replace URL with your Django tag -->
                        <a href="{% url 'experiment:demographics' %}" class="btn btn-primary btn-lg btn-block font-weight-bold py-3 shadow-sm">
                            Proceed to Demographics <i class="fas fa-arrow-right ml-2"></i>
                        </a>

                    </div>
                </div>
            </div>
        </div>
    </div>
<script>
    // 1. Push a new state so there is a history entry to trap
    history.pushState(null, null, location.href);

    // 2. Intercept any popstate event (triggered when user clicks "Back")
    window.onpopstate = function () {
        history.pushState(null, null, location.href);
        alert("Navigating backwards is disabled during this experiment.");
    };
</script>
</body>
</html>
