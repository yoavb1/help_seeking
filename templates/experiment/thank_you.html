<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simulation Complete</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; min-height: 100vh; display: flex; align-items: center; }
        .success-card { border: none; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; }
    </style>
</head>
<body>
    <div class="container text-center">
        <div class="card success-card p-5 mx-auto" style="max-width: 550px;">
            <div class="text-success mb-4">
                <i class="fas fa-check-circle fa-4x"></i>
            </div>
            <h3 class="font-weight-bold text-dark mb-2">Evaluation Complete</h3>
            <hr>
            <p class="text-secondary leading-relaxed mb-3">
                Thank you for your participation! Please click the button below to submit your study on Prolific and receive your reward.
            </p>

            <!-- PROLIFIC MANUAL BUTTON -->
            <div class="my-4">
                <a href="https://app.prolific.com/submissions/complete?cc={{ PROLIFIC_COMPLETION_CODE }}"
                   class="btn btn-success btn-lg px-4 font-weight-bold shadow-sm">
                    Complete Study on Prolific <i class="fas fa-external-link-alt ml-2"></i>
                </a>
            </div>
        </div>
    </div>

<script>
    // 1. Push a new state so there is a history entry to trap
    history.pushState(null, null, location.href);

    // 2. Intercept any popstate event (triggered when user clicks "Back")
    window.onpopstate = function () {
        history.pushState(null, null, location.href);
        alert("Navigating backwards is disabled during this experiment.");
    };
</script>
</body>
</html>
