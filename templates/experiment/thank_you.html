<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simulation Complete</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; min-height: 100vh; display: flex; align-items: center; }
        .success-card { border: none; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; }
    </style>
</head>
<body>
    <div class="container text-center">
        <div class="card success-card p-5 max-width mx-auto" style="max-width: 550px;">
            <div class="text-success mb-4">
                <i class="fas fa-check-circle fa-4x"></i>
            </div>
            <h3 class="font-weight-bold text-dark mb-2">Evaluation Complete</h3>
            <hr>
            <p class="text-muted small font-italic mb-0">Thank you for your cooperation during this operational run. You may now close this window safely.</p>
        </div>
    </div>
</body>
</html>
